<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Step Solar CRM — Lead & Installation Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --blue:#1B6FA8; --blue-deep:#12507B;
    --green:#3FA535; --green-deep:#2C7C24;
    --brown:#8A6C3F; --sun:#F5A623;
    --sand:#F4F8F4; --paper:#FFFFFF;
    --ink:#182420; --ink-soft:#4B5A54;
    --line: rgba(24,36,32,0.12);
    --danger:#C24A3E;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--sand); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Inter',sans-serif; cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}
  ::selection{background:var(--sun); color:#2A1A00;}

  #app{min-height:100vh; display:flex; flex-direction:column;}
  header.top{
    position:sticky; top:0; z-index:50; background:rgba(244,248,244,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:1360px; margin:0 auto; padding:0 22px; height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{height:44px; width:auto;}
  .brand-text b{font-family:'Space Grotesk'; font-size:1.02rem; display:block; line-height:1.1;}
  .brand-text span{display:block; font-size:0.65rem; color:var(--ink-soft); font-family:'IBM Plex Mono'; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;}
  .tabs{display:flex; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px;}
  .tab{padding:8px 16px; border:none; background:transparent; border-radius:999px; font-size:0.85rem; font-weight:600; color:var(--ink-soft);}
  .tab.active{background:linear-gradient(90deg,var(--blue),var(--green-deep)); color:#fff;}
  .top-right{display:flex; align-items:center; gap:12px;}
  .role-select{display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--ink-soft);}
  select.role-picker{
    padding:9px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); font-weight:600; color:var(--ink); font-size:0.85rem;
  }
  .btn{display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:10px; border:none; font-weight:600; font-size:0.85rem; transition:transform .15s ease, box-shadow .15s ease;}
  .btn-sun{background:var(--sun); color:#2A1A00; box-shadow:0 6px 16px -6px rgba(245,166,35,.7);}
  .btn-sun:hover{transform:translateY(-1px);}
  .btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
  .btn-outline:hover{border-color:var(--blue); color:var(--blue);}
  .btn-ghost{background:var(--sand); color:var(--ink-soft); border:1px solid var(--line);}
  .btn-danger{background:rgba(194,74,62,0.1); color:var(--danger);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .live-dot{width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(63,165,53,0.5); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,165,53,0.55);}70%{box-shadow:0 0 0 8px rgba(63,165,53,0);}100%{box-shadow:0 0 0 0 rgba(63,165,53,0);}}

  main{flex:1; max-width:1360px; margin:0 auto; padding:26px 22px 60px; width:100%;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px;}
  @media (max-width:900px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
  .stat-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px 20px;}
  .stat-card .k{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:600;}
  .stat-card .v{font-family:'Space Grotesk'; font-weight:700; font-size:1.8rem; margin-top:6px;}
  .stat-card .v.blue{color:var(--blue-deep);} .stat-card .v.green{color:var(--green-deep);} .stat-card .v.sun{color:#8a5b0c;} .stat-card .v.brown{color:var(--brown);}

  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:22px;}
  .panel h2{font-size:1.1rem; margin-bottom:16px;}
  .funnel-row{display:flex; align-items:center; gap:14px; padding:8px 0;}
  .funnel-label{flex:0 0 210px; font-size:0.82rem; color:var(--ink-soft); font-weight:500;}
  .funnel-bar-track{flex:1; background:var(--sand); border-radius:8px; height:26px; overflow:hidden; position:relative;}
  .funnel-bar-fill{height:100%; background:linear-gradient(90deg,var(--blue),var(--green)); border-radius:8px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; min-width:2px;}
  .funnel-bar-fill span{color:#fff; font-family:'IBM Plex Mono'; font-size:0.72rem; font-weight:600;}

  .filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .filter-bar input, .filter-bar select{padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); font-size:0.85rem;}
  .filter-bar input{flex:1; min-width:180px;}
  table.leads{width:100%; border-collapse:collapse; font-size:0.86rem;}
  table.leads th{text-align:left; padding:10px 12px; color:var(--ink-soft); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; border-bottom:1.5px solid var(--line);}
  table.leads td{padding:12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.leads tr:hover td{background:var(--sand);}
  table.leads tbody tr{cursor:pointer;}
  .badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:0.72rem; font-weight:600;}
  .badge.completed{background:rgba(63,165,53,0.14); color:var(--green-deep);}
  .badge.inprogress{background:rgba(27,111,168,0.14); color:var(--blue-deep);}
  .badge.pending{background:rgba(24,36,32,0.08); color:var(--ink-soft);}
  .chip-role{display:inline-block; padding:3px 9px; border-radius:999px; font-size:0.68rem; font-weight:700; font-family:'IBM Plex Mono'; letter-spacing:0.03em;}
  .chip-role.Sales{background:rgba(27,111,168,0.14); color:var(--blue-deep);}
  .chip-role.SiteSurvey{background:rgba(245,166,35,0.18); color:#8a5b0c;}
  .chip-role.Installation{background:rgba(63,165,53,0.14); color:var(--green-deep);}
  .chip-role.Accounts{background:rgba(138,108,63,0.18); color:var(--brown);}
  .empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty b{display:block; color:var(--ink); font-family:'Space Grotesk'; font-size:1.05rem; margin-bottom:6px;}

  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:20px;}
  .detail-head h2{font-size:1.5rem;}
  .detail-meta{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:0.82rem; color:var(--ink-soft);}
  .detail-meta b{color:var(--ink);}
  .detail-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;}
  @media (max-width:980px){ .detail-grid{grid-template-columns:1fr;} }

  .stage{border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .stage-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; background:var(--paper);}
  .stage-num{flex:0 0 30px; height:30px; width:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:0.78rem; font-weight:600; border:2px solid var(--line); color:var(--ink-soft);}
  .stage.completed .stage-num{background:var(--green-deep); border-color:var(--green-deep); color:#fff;}
  .stage.inprogress .stage-num{background:var(--blue); border-color:var(--blue); color:#fff;}
  .stage-title{flex:1;}
  .stage-title .l{font-weight:600; font-size:0.92rem;}
  .stage-title .s{font-size:0.72rem; color:var(--ink-soft); margin-top:2px;}
  .stage-tags{display:flex; gap:6px; align-items:center;}
  .tag-actor{font-size:0.68rem; padding:3px 8px; border-radius:6px; background:var(--sand); color:var(--ink-soft); font-family:'IBM Plex Mono'; font-weight:600;}
  .stage-body{padding:0 16px 16px; display:none; border-top:1px solid var(--line);}
  .stage.open .stage-body{display:block; padding-top:14px;}
  .stage-body label{font-size:0.74rem; font-weight:600; color:var(--ink-soft); display:block; margin:10px 0 5px;}
  .stage-body select, .stage-body textarea, .stage-body input{width:100%; padding:9px 11px; border-radius:8px; border:1.5px solid var(--line); font-size:0.85rem;}
  .stage-body textarea{resize:vertical; min-height:56px;}
  .doc-list{display:flex; flex-direction:column; gap:6px; margin:8px 0;}
  .doc-item{display:flex; align-items:center; justify-content:space-between; background:var(--sand); border-radius:8px; padding:7px 10px; font-size:0.8rem;}
  .doc-item .x{color:var(--danger); font-weight:700; cursor:pointer; padding:0 4px;}
  .locked-note{font-size:0.75rem; color:var(--ink-soft); background:var(--sand); border-radius:8px; padding:10px 12px; margin-top:8px; display:flex; align-items:center; gap:8px;}

  .qi-table{width:100%; border-collapse:collapse; margin:12px 0; font-size:0.84rem;}
  .qi-table th{text-align:left; padding:8px; background:var(--sand); font-size:0.7rem; text-transform:uppercase; color:var(--ink-soft);}
  .qi-table td{padding:7px 8px; border-bottom:1px solid var(--line);}
  .qi-table input{border:1px solid transparent; background:transparent; width:100%; padding:5px 6px; border-radius:6px;}
  .qi-table input:focus{border-color:var(--blue); background:var(--paper); outline:none;}
  .qi-totals{margin-top:10px; font-size:0.86rem; display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .qi-totals .row{display:flex; gap:30px; justify-content:space-between; width:260px;}
  .qi-totals .grand{font-family:'Space Grotesk'; font-weight:700; font-size:1.15rem; color:var(--green-deep); border-top:1.5px solid var(--line); padding-top:6px; margin-top:4px;}
  .row-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(10,20,14,0.55); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:200; overflow-y:auto;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--paper); border-radius:16px; padding:28px; width:100%; max-width:640px; margin-bottom:40px;}
  .modal h3{margin-bottom:16px; font-size:1.2rem;}
  .modal .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal label{font-size:0.78rem; font-weight:600; color:var(--ink-soft); display:block; margin:10px 0 5px;}
  .modal input, .modal select{width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line); font-size:0.88rem;}
  .choice-group{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .choice{position:relative;}
  .choice input{position:absolute; opacity:0; width:0; height:0;}
  .choice span{display:inline-flex; padding:8px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--sand); font-size:0.78rem; color:var(--ink-soft); cursor:pointer; font-weight:500;}
  .choice input:checked + span{background:linear-gradient(90deg,var(--blue),var(--green-deep)); color:#fff; border-color:transparent;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

  .toast{position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:13px 20px; border-radius:10px; font-size:0.86rem; z-index:300; display:none; box-shadow:0 12px 30px rgba(0,0,0,0.3);}
  .toast.show{display:block;}
  .toast.err{background:var(--danger);}

  .section-label{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:700; margin-bottom:10px;}

  /* Login gate */
  .gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
        background:radial-gradient(700px 400px at 15% 10%, rgba(27,111,168,0.10), transparent 60%),
                   radial-gradient(600px 400px at 90% 90%, rgba(63,165,53,0.12), transparent 60%);}
  .gate-card{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:36px; max-width:420px; width:100%; box-shadow:0 20px 60px -20px rgba(18,80,123,0.25);}
  .gate-card img{height:56px; margin-bottom:16px;}
  .gate-card h1{font-size:1.4rem; margin-bottom:6px;}
  .gate-card p{color:var(--ink-soft); font-size:0.9rem; margin-bottom:20px;}
  .gate-card label{font-size:0.78rem; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .gate-card input{width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:0.95rem; margin-bottom:14px;}
  .gate-card input:focus{outline:none; border-color:var(--blue);}
  .gate-card .err{color:var(--danger); font-size:0.82rem; margin-top:-6px; margin-bottom:10px; display:none;}
  .gate-card .err.show{display:block;}

  /* ===== CRM v2 — assignment, tasks, comments, activity ===== */
  .assign-bar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px; margin-bottom:18px;}
  .assign-bar .k{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft); font-weight:700;}
  .assign-bar select{padding:9px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); font-size:0.85rem; font-weight:600;}
  .assign-chip{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:rgba(27,111,168,0.12); color:var(--blue-deep); font-size:0.8rem; font-weight:600;}
  .assign-chip.unassigned{background:rgba(245,166,35,0.18); color:#8a5b0c;}

  .addon-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start;}
  @media (max-width:980px){ .addon-grid{grid-template-columns:1fr;} }

  .task-row{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:0.86rem;}
  .task-row:last-child{border-bottom:none;}
  .task-row input[type=checkbox]{margin-top:3px; accent-color:var(--green-deep); width:16px; height:16px;}
  .task-row .tt{flex:1;}
  .task-row .tt.done{text-decoration:line-through; color:var(--ink-soft);}
  .task-row .meta{font-size:0.72rem; color:var(--ink-soft); margin-top:2px;}
  .task-row .x{color:var(--danger); cursor:pointer; font-weight:700; padding:0 4px;}
  .task-add{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;}
  .task-add input[type=text]{flex:1; min-width:150px; padding:9px 11px; border-radius:8px; border:1.5px solid var(--line); font-size:0.84rem;}
  .task-add input[type=date]{padding:8px 9px; border-radius:8px; border:1.5px solid var(--line); font-size:0.8rem;}
  .task-add select{padding:8px 9px; border-radius:8px; border:1.5px solid var(--line); font-size:0.8rem;}

  .comment-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .comment-item:last-child{border-bottom:none;}
  .comment-avatar{flex:0 0 30px; height:30px; width:30px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--green-deep)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; font-family:'IBM Plex Mono';}
  .comment-body .who{font-size:0.74rem; font-weight:600;}
  .comment-body .who span{color:var(--ink-soft); font-weight:400; font-size:0.7rem;}
  .comment-body .txt{font-size:0.86rem; margin-top:2px; white-space:pre-wrap; word-break:break-word;}
  .comment-add{display:flex; gap:8px; margin-top:10px;}
  .comment-add textarea{flex:1; padding:9px 11px; border-radius:8px; border:1.5px solid var(--line); font-size:0.85rem; resize:vertical; min-height:44px;}

  .act-item{display:flex; gap:10px; padding:7px 0; font-size:0.8rem; border-bottom:1px dashed var(--line);}
  .act-item:last-child{border-bottom:none;}
  .act-item .dot{flex:0 0 8px; height:8px; width:8px; border-radius:50%; background:var(--sun); margin-top:6px;}
  .act-item .who{font-weight:600;}
  .act-item .when{color:var(--ink-soft); font-size:0.7rem;}
  .act-item .detail{color:var(--ink-soft);}
  .act-panel{max-height:340px; overflow-y:auto;}

  .q-status{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:0.74rem; font-weight:700;}
  .q-status.Draft{background:rgba(24,36,32,0.08); color:var(--ink-soft);}
  .q-status.Sent{background:rgba(27,111,168,0.14); color:var(--blue-deep);}
  .q-status.Approved{background:rgba(63,165,53,0.14); color:var(--green-deep);}
  .q-status.Rejected{background:rgba(194,74,62,0.14); color:var(--danger);}
  .q-rev{font-family:'IBM Plex Mono'; font-size:0.7rem; color:var(--ink-soft);}

  .pay-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:0.8rem;}
  .pay-row:last-child{border-bottom:none;}
  .pay-row .amt{font-family:'IBM Plex Mono'; font-weight:600;}
  .pay-row .x{color:var(--danger); cursor:pointer; font-weight:700; padding:0 4px;}
  .pay-form{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .pay-form input, .pay-form select{padding:9px 10px; border-radius:8px; border:1.5px solid var(--line); font-size:0.84rem;}
  @media (max-width:680px){ .pay-form{grid-template-columns:1fr;} }

  /* ===== Kanban board ===== */
  .kanban-toolbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .kanban-toolbar h2{font-size:1.1rem;}
  .kanban{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; align-items:start;}
  @media (max-width:700px){ .kanban{grid-template-columns:1fr;} }
  .kanban-col{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px; min-height:140px; transition:background .15s ease, border-color .15s ease;}
  .kanban-col.drag-over{background:#eef5fb; border-color:var(--blue);}
  .kanban-col-head{display:flex; align-items:center; gap:8px;}
  .kanban-num{flex:0 0 22px; height:22px; width:22px; border-radius:50%; background:var(--sand); border:1.5px solid var(--line); color:var(--ink-soft); font-family:'IBM Plex Mono'; font-size:0.68rem; font-weight:600; display:flex; align-items:center; justify-content:center;}
  .kanban-title{flex:1; font-weight:600; font-size:0.82rem; line-height:1.25;}
  .kanban-count{font-family:'IBM Plex Mono'; font-size:0.7rem; font-weight:600; color:var(--blue-deep); background:rgba(27,111,168,0.12); padding:2px 8px; border-radius:999px;}
  .kanban-col-sub{margin:6px 0 8px;}
  .kanban-cards{display:flex; flex-direction:column; gap:8px;}
  .kanban-card{background:var(--sand); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:grab; transition:transform .1s ease, box-shadow .1s ease;}
  .kanban-card:hover{transform:translateY(-1px); box-shadow:0 8px 18px -10px rgba(18,80,123,0.35);}
  .kanban-card:active{cursor:grabbing;}
  .kc-top{display:flex; justify-content:space-between; gap:6px; font-size:0.7rem;}
  .kc-code{color:var(--blue-deep); font-weight:600;}
  .kc-assigned{color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90px;}
  .kc-name{font-weight:600; font-size:0.86rem; margin-top:3px; color:var(--ink);}
  .kc-meta{font-size:0.72rem; color:var(--ink-soft); margin-top:4px;}
  .kanban-empty{font-size:0.74rem; color:var(--ink-soft); text-align:center; padding:18px 0; border:1px dashed var(--line); border-radius:8px;}
  .kanban-done{display:flex; flex-wrap:wrap; gap:8px;}
  .done-chip{background:rgba(63,165,53,0.14); color:var(--green-deep); font-size:0.78rem; font-weight:600; padding:6px 12px; border-radius:999px;}

  /* ===== Solar / survey / inventory / ROI panels ===== */
  .solar-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;}
  @media (max-width:680px){ .solar-grid{grid-template-columns:1fr;} }

  @media (max-width:980px){ .ops-grid{grid-template-columns:1fr;} }
  .wlog-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:0.8rem; flex-wrap:wrap;}
  .wlog-row:last-child{border-bottom:none;}

  .wlog-status.SUCCESS{background:rgba(63,165,53,0.14); color:var(--green-deep);}
  .wlog-status.FAILED{background:rgba(194,74,62,0.14); color:var(--danger);}
  .wlog-status.PENDING{background:rgba(245,166,35,0.18); color:#8a5b0c;}

  .wa-settings-grid label{display:flex; flex-direction:column; gap:6px; font-size:0.74rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;}
  .wa-settings-grid input,.wa-settings-grid select,.wa-settings-grid textarea{
    text-transform:none; font-weight:500; font-size:0.85rem; color:var(--ink);
    padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--paper); font-family:'IBM Plex Mono';
  }
  .wa-settings-grid .wa-wide{grid-column:1/-1;}
  .wa-settings-grid textarea{resize:vertical;}
  .wa-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);}
  .wa-test-phone{width:180px; padding:9px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:'IBM Plex Mono'; font-size:0.85rem; background:var(--paper);}
  .wa-msg{font-size:0.75rem; color:var(--ink-soft); margin-left:4px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= CONFIG ======================= */
const API_BASE = window.location.origin; // served on same origin as backend
const LEADS_URL = API_BASE + '/api/crm/leads';
const META_URL  = API_BASE + '/api/crm/meta';
const AUTH_KEY = 'stepsolar.crm.auth'; // {token, role, email, full_name}

const STAGE_TEMPLATE = [
  {key:'lead_captured',           label:'Lead Captured',             actor:'Customer', owner:'Sales'},
  {key:'site_survey_scheduled',   label:'Site Survey Scheduled',     actor:'Engineer', owner:'Sales'},
  {key:'survey_completed',        label:'Site Survey Completed',     actor:'Engineer', owner:'Site Survey'},
  {key:'quotation_sent',          label:'Quotation Sent',            actor:'Sales',    owner:'Sales'},
  {key:'docs_verified',           label:'Documents Verified',        actor:'Accounts', owner:'Accounts'},
  {key:'discom_applied',          label:'DISCOM Application',        actor:'Discom',   owner:'Accounts'},
  {key:'material_dispatched',     label:'Material Dispatched',       actor:'Vendor',   owner:'Installation'},
  {key:'installation_in_progress', label:'Installation In Progress', actor:'Engineer', owner:'Installation'},
  {key:'net_metering_pending',    label:'Net Metering Pending',      actor:'Discom',   owner:'Installation'},
  {key:'commissioned',            label:'Commissioned',              actor:'Discom',   owner:'Installation'},
  {key:'subsidy_disbursed',       label:'Subsidy Disbursed',         actor:'REC',      owner:'Accounts'}
];
const ROLES = ['Sales','Site Survey','Installation','Accounts'];
const SOLAR_SUBSIDY_STATUSES = ['Not Applied','Applied','Approved','Disbursed','Rejected'];

function makeQuotationItems(monthlyBill){
  const bill = Number(monthlyBill)||4000;
  const kw = Math.max(1, Math.round((bill/8/120)*2)/2);
  const total = kw*55000;
  return {
    systemSizeKw: kw,
    items: [
      {desc:`Solar PV Modules (Tier-1, ${kw} kW)`, qty:1, rate: Math.round(total*0.55)},
      {desc:'Grid-Tie Inverter', qty:1, rate: Math.round(total*0.20)},
      {desc:'Mounting Structure', qty:1, rate: Math.round(total*0.10)},
      {desc:'Cabling, DCDB/ACDB & Balance of System', qty:1, rate: Math.round(total*0.08)},
      {desc:'Installation & Commissioning Charges', qty:1, rate: Math.round(total*0.07)}
    ],
    gstPercent: 12
  };
}

/* ======================= STATE ======================= */
function _loadAuth(){
  try{
    const raw = localStorage.getItem(AUTH_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
const _savedAuth = _loadAuth();

let DATA = {leads:[]};
let STATE = {
  token: _savedAuth?.access_token || '',
  role: _savedAuth?.role || '',
  email: _savedAuth?.email || '',
  fullName: _savedAuth?.full_name || '',
  userId: _savedAuth?.id || '',
  authed: false,
  view: 'dashboard',
  activeLeadId: null,
  search: '',
  stageFilter: 'all',
  openStages: {},
  loaded: false,
  lastSync: null,
  syncing: false,
  gateError: ''
};
let POLL_TIMER = null;

/* ======================= API ======================= */
async function api(path, opts={}){
  const url = API_BASE + path;
  const headers = Object.assign(
    STATE.token ? {'Authorization': 'Bearer ' + STATE.token} : {},
    opts.headers || {}
  );
  if(opts.body && !(opts.body instanceof FormData)){
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(url, {...opts, headers});
  if(res.status === 401){
    STATE.authed = false;
    localStorage.removeItem(AUTH_KEY);
    STATE.token = ''; STATE.role = ''; STATE.email = ''; STATE.fullName = ''; STATE.userId = '';
    stopPolling();
    render();
    throw new Error('unauthorized');
  }
  if(res.status === 403){
    const isJson2 = (res.headers.get('content-type')||'').includes('application/json');
    const data2 = isJson2 ? await res.json() : null;
    throw new Error((data2 && data2.detail) || 'You do not have permission to do that.');
  }
  const isJson = (res.headers.get('content-type')||'').includes('application/json');
  const data = isJson ? await res.json() : null;
  if(!res.ok){
    const msg = (data && (data.detail || data.message)) || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}

async function refreshLeads(silent){
  if(STATE.syncing) return;
  STATE.syncing = true;
  try{
    const items = await api('/api/crm/leads');
    const prevSig = leadsSignature(DATA.leads);
    DATA.leads = items;
    STATE.loaded = true;
    STATE.lastSync = new Date();
    if(!silent){
      render();
    } else {
      updateLiveIndicator();
      // Re-render on data change, but skip while a modal is open or the
      // user is actively typing (would clobber focus/uncommitted input).
      const modalOpen = document.getElementById('modalBackdrop')?.classList.contains('open');
      const editing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
      const changed = leadsSignature(items) !== prevSig;
      if(changed && !modalOpen && !editing){
        render();
      }
    }
  }catch(e){
    if(e.message !== 'unauthorized'){
      console.error('Refresh failed', e);
      if(!silent) showToast('Sync failed: ' + e.message, true);
    }
  }finally{
    STATE.syncing = false;
  }
}

/** Cheap change-detection signature — id + updated_at + stage statuses
 *  + counts of comments/open tasks + assignment + doc/invoice/quotation state. */
function leadsSignature(leads){
  return (leads || []).map(l => {
    const stat = (l.stages || []).map(s => s.status || '').join('|');
    const extra = [
      (l.comments||[]).length,
      (l.tasks||[]).filter(t=>t.status==='open').length,
      l.assigned_to || '',
      (l.docCount != null ? l.docCount : (l.stages||[]).reduce((a,s)=>a+(s.documents||[]).length,0)),
      l.invoice ? (l.invoice.paymentStatus||'') + ':' + (l.invoice.paidAmount||0) : '',
      l.quotation ? (l.quotation.status||'') : ''
    ].join('|');
    return `${l.id}:${l.updated_at || l.updatedAt || ''}:${stat}:${extra}`;
  }).join(';');
}

function startPolling(){
  stopPolling();
  POLL_TIMER = setInterval(()=>refreshLeads(true), 5000);
}
function stopPolling(){
  if(POLL_TIMER){ clearInterval(POLL_TIMER); POLL_TIMER = null; }
}

/* ======================= HELPERS ======================= */
// Escape untrusted lead/user data before inserting into innerHTML — prevents
// stored XSS from lead fields (full_name, notes, uploaded doc names, etc.)
// that originate from the public website form and are attacker-controlled.
function esc(v){
  return String(v==null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function fmtINR(n){ return '₹' + Math.round(n||0).toLocaleString('en-IN'); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function currentStageIndex(lead){
  const i = (lead.stages || []).findIndex(s => s.status !== 'Completed');
  return i === -1 ? (lead.stages || []).length-1 : i;
}
function overallStatus(lead){
  const stages = lead.stages || [];
  if(stages.length === 0) return 'New';
  const allDone = stages.every(s=>s.status==='Completed');
  if(allDone) return 'Completed';
  const anyProgress = stages.some(s=>s.status!=='Pending');
  return anyProgress ? 'In Progress' : 'New';
}
function roleClass(role){ return (role||'').replace(/\s+/g,''); }
function findLead(id){ return DATA.leads.find(l=>l.id===id); }
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr?' err':'');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}
// Camel/snake normaliser — website leads use snake_case; CRM uses camelCase display fields.
function displayLead(l){
  return {
    ...l,
    name: l.name || l.full_name || '',
    contact: l.contact || l.phone || '',
    propertyType: l.propertyType || l.property_type || '',
    monthlyBill: l.monthlyBill != null ? l.monthlyBill : (l.monthly_bill != null ? l.monthly_bill : 0),
    roofType: l.roofType || l.roof_type || '',
    timeline: l.timeline || '',
    createdAt: l.createdAt || l.created_at || ''
  };
}

/* ======================= RENDER ======================= */
function render(){
  const app = document.getElementById('app');
  if(!STATE.authed){ app.innerHTML = renderGate(); wireGate(); return; }
  if(!STATE.loaded){ app.innerHTML = renderHeader() + '<main><div style="padding:60px;text-align:center;color:#4B5A54;">Loading CRM data…</div></main>'; return; }
  app.innerHTML = renderHeader() + '<main>' + (
    STATE.view==='dashboard' ? renderDashboard() :
    STATE.view==='leads' ? renderLeadsView() :
    STATE.view==='kanban' ? renderKanbanView() :
    STATE.view==='detail' ? renderLeadDetail() :
    STATE.view==='ops' && STATE.role==='Admin' ? renderOpsView() :
    STATE.view==='users' && STATE.role==='Admin' ? renderUsersView() : ''
  ) + '</main>';
  if(STATE.view==='users' && STATE.role==='Admin') wireUsersView();
}

function updateLiveIndicator(){
  const el = document.getElementById('lastSyncTxt');
  if(el && STATE.lastSync) el.textContent = STATE.lastSync.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

/* ---- Login gate ---- */
function renderGate(){
  const errShow = STATE.gateError ? 'show' : '';
  const errText = STATE.gateError || 'Invalid email or password — please try again.';
  return `
  <div class="gate">
    <div class="gate-card">
      <img src="/logo.jpg" alt="Step Solar" onerror="this.style.display='none'">
      <h1>Step Solar CRM</h1>
      <p>Sign in with your Step Solar account to access the lead pipeline.</p>
      <label>Email</label>
      <input id="emailInput" type="email" placeholder="you@stepsolar.in" autocomplete="username" data-testid="gate-email-input">
      <label style="margin-top:10px;">Password</label>
      <input id="passwordInput" type="password" placeholder="Your password" autocomplete="current-password" data-testid="gate-password-input">
      <div class="err ${errShow}" id="gateErr" data-testid="gate-error">${errText}</div>
      <button class="btn btn-sun" style="width:100%; padding:12px; font-size:0.95rem; margin-top:8px;" id="gateSubmit" data-testid="gate-submit">Sign in</button>
      <p style="font-size:0.72rem; color:var(--ink-soft); margin-top:14px;">Don't have an account? Ask your admin to create one for you.</p>
    </div>
  </div>`;
}
function wireGate(){
  const emailInput = document.getElementById('emailInput');
  const passInput = document.getElementById('passwordInput');
  const btn = document.getElementById('gateSubmit');
  const submit = async ()=>{
    const email = (emailInput.value || '').trim();
    const password = passInput.value || '';
    if(!email || !password){
      STATE.gateError = 'Please enter your email and password.';
      render();
      return;
    }
    STATE.gateError = '';
    btn.disabled = true; btn.textContent = 'Signing in…';
    try{
      const res = await fetch(API_BASE + '/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password})
      });
      const data = await res.json().catch(()=>null);
      if(!res.ok){
        throw new Error((data && data.detail) || 'Invalid email or password.');
      }
      STATE.token = data.access_token;
      STATE.role = data.role;
      STATE.email = data.email;
      STATE.fullName = data.full_name;
      STATE.userId = data.id;
      localStorage.setItem(AUTH_KEY, JSON.stringify(data));
      STATE.authed = true;
      STATE.gateError = '';
      if(data.must_change_password){
        render();
        openForceChangePasswordModal();
        return;
      }
      await refreshLeads();
      startPolling();
      loadTeam();
    }catch(e){
      STATE.token = ''; STATE.role = '';
      STATE.gateError = e.message || 'Sign in failed.';
      render();
    }
  };
  btn.addEventListener('click', submit);
  passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  emailInput.addEventListener('keydown', e=>{ if(e.key==='Enter') passInput.focus(); });
  emailInput.focus();
}

function renderHeader(){
  const syncTxt = STATE.lastSync ? STATE.lastSync.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
  return `
  <header class="top"><div class="top-inner">
    <div class="brand">
      <img src="/logo.jpg" alt="Step Solar" onerror="this.style.display='none'">
      <div class="brand-text">
        <b>Step Solar CRM</b>
        <span>Lead &amp; Installation Pipeline</span>
      </div>
    </div>
    <div class="tabs">
      <button class="tab ${STATE.view==='dashboard'?'active':''}" onclick="goView('dashboard')" data-testid="tab-dashboard">Dashboard</button>
      <button class="tab ${STATE.view==='leads'||STATE.view==='detail'?'active':''}" onclick="goView('leads')" data-testid="tab-leads">Leads</button>
      <button class="tab ${STATE.view==='kanban'?'active':''}" onclick="goView('kanban')" data-testid="tab-kanban">Kanban</button>
      ${STATE.role==='Admin' ? `<button class="tab ${STATE.view==='ops'?'active':''}" onclick="goView('ops')" data-testid="tab-ops">Inventory &amp; WhatsApp</button>` : ''}
      ${STATE.role==='Admin' ? `<button class="tab ${STATE.view==='users'?'active':''}" onclick="goView('users')" data-testid="tab-users">Users</button>` : ''}
    </div>
    <div class="top-right">
      <div class="role-select" title="Live sync (5s)"><span class="live-dot"></span><span style="font-family:'IBM Plex Mono';font-size:0.72rem;">Synced <span id="lastSyncTxt">${syncTxt}</span></span></div>
      <div class="role-select" title="${STATE.email}" data-testid="signed-in-as">
        <b>${STATE.fullName || STATE.email}</b>&nbsp;·&nbsp;${STATE.role}
      </div>
      <button class="btn btn-sun" onclick="openNewLeadModal()" data-testid="new-lead-btn">+ New Lead</button>
      <button class="btn btn-ghost" onclick="signOut()" title="Sign out" data-testid="sign-out">⎋</button>
    </div>
  </div></header>`;
}

function signOut(){
  localStorage.removeItem(AUTH_KEY);
  STATE.token = ''; STATE.role = ''; STATE.email = ''; STATE.fullName = ''; STATE.userId = '';
  STATE.authed = false; STATE.loaded = false;
  stopPolling(); render();
}
function goView(v){ STATE.view=v; STATE.activeLeadId=null; render(); }

/* ---- Dashboard ---- */
function renderDashboard(){
  const leads = DATA.leads.map(displayLead);
  const total = leads.length;
  const completed = leads.filter(l=>overallStatus(l)==='Completed').length;
  const inProgress = leads.filter(l=>overallStatus(l)==='In Progress').length;
  const newLeads = leads.filter(l=>overallStatus(l)==='New').length;

  const stageCounts = STAGE_TEMPLATE.map((t,i)=>({
    label:t.label,
    count: leads.filter(l=>currentStageIndex(l)===i && overallStatus(l)!=='Completed').length
  }));
  const maxCount = Math.max(1, ...stageCounts.map(s=>s.count));

  const myTasks = STATE.role==='Admin' ? total : leads.filter(l=>{
    if(overallStatus(l)==='Completed') return false;
    if(l.assigned_to===STATE.userId) return true;
    const idx = currentStageIndex(l);
    return (l.stages||[])[idx] && l.stages[idx].owner===STATE.role;
  }).length;
  const unassigned = leads.filter(l=> overallStatus(l)!=='Completed' && !l.assigned_to).length;

  return `
  <div class="stat-grid">
    <div class="stat-card" data-testid="stat-total"><div class="k">Total Leads</div><div class="v blue">${total}</div></div>
    <div class="stat-card" data-testid="stat-new"><div class="k">New / Unassigned</div><div class="v sun">${newLeads}</div></div>
    <div class="stat-card" data-testid="stat-inprogress"><div class="k">In Progress</div><div class="v blue">${inProgress}</div></div>
    <div class="stat-card" data-testid="stat-completed"><div class="k">Fully Commissioned</div><div class="v green">${completed}</div></div>
  </div>
  ${STATE.role!=='Admin' ? `<div class="panel"><h2>My Pending Tasks — ${STATE.role}</h2><p style="color:var(--ink-soft); font-size:0.9rem;">${myTasks} lead(s) currently waiting on your action (assigned to you, or in your team's stage). <a href="#" onclick="goView('leads'); return false;" style="color:var(--blue); font-weight:600;">View my tasks →</a></p></div>` : ''}
  ${(STATE.role==='Admin'||STATE.role==='Sales') ? `<div class="panel"><h2>Unassigned Queue</h2><p style="color:var(--ink-soft); font-size:0.9rem;">${unassigned} lead(s) have no owner assigned yet. <a href="#" onclick="goView('leads'); return false;" style="color:var(--blue); font-weight:600;">Assign them →</a></p></div>` : ''}
  <div class="panel">
    <h2>Pipeline Funnel — where leads are stuck right now</h2>
    ${stageCounts.map(s=>`
      <div class="funnel-row">
        <div class="funnel-label">${s.label}</div>
        <div class="funnel-bar-track">
          <div class="funnel-bar-fill" style="width:${Math.max(6,(s.count/maxCount)*100)}%;"><span>${s.count>0?s.count:''}</span></div>
        </div>
      </div>`).join('')}
  </div>
  <div class="panel">
    <h2>Recent Leads</h2>
    ${renderLeadsTable(leads.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5))}
  </div>`;
}

/* ---- Leads list ---- */
function renderLeadsView(){
  let leads = DATA.leads.map(displayLead);
  if(STATE.role!=='Admin'){
    leads = leads.filter(l=> {
      if(overallStatus(l)==='Completed') return false;
      if(l.assigned_to===STATE.userId) return true;
      const idx = currentStageIndex(l);
      return (l.stages||[])[idx] && l.stages[idx].owner===STATE.role;
    });
  }
  if(STATE.search){
    const q = STATE.search.toLowerCase();
    leads = leads.filter(l => (l.name||'').toLowerCase().includes(q) || (l.contact||'').includes(q) || (l.code||'').toLowerCase().includes(q));
  }
  if(STATE.stageFilter!=='all'){

let _dragLeadId = null;
function dragStart(e, leadId){ _dragLeadId = leadId; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', leadId); }
async function dropOnStage(e, targetIndex){
  e.preventDefault();
  const leadId = _dragLeadId || e.dataTransfer.getData('text/plain');
  _dragLeadId = null;
  document.querySelectorAll('.kanban-col').forEach(c=>c.classList.remove('drag-over'));
  if(!leadId) return;
  const lead = findLead(leadId);
  if(!lead) return;
  if(currentStageIndex(lead)===targetIndex) return;
  const stages = JSON.parse(JSON.stringify(lead.stages||[]));
  if(targetIndex >= stages.length){ showToast('Invalid target stage', true); return; }
  const target = stages[targetIndex];
  if(target.status==='Completed'){ showToast('That stage is already completed', true); return; }
  target.status = 'In Progress';
  target.updatedAt = new Date().toISOString();
  // auto-complete all prior stages so the lead's "current" stage is the target
  for(let i=0;i<targetIndex;i++){ if(stages[i].status!=='Completed'){ stages[i].status='Completed'; stages[i].updatedAt=new Date().toISOString(); } }
  try{
    const updated = await api(`/api/crm/leads/${leadId}`, {method:'PATCH', body: JSON.stringify({stages})});
    const idx = DATA.leads.findIndex(l=>l.id===leadId);
    if(idx>=0) DATA.leads[idx] = updated;
    showToast(`${lead.code} moved to "${target.label}"`);
    render();
  }catch(err){ showToast('Move failed: ' + err.message, true); }
}

function toggleStage(i){ STATE.openStages[i] = !STATE.openStages[i]; render(); }

async function patchStages(lead){
  try{
    const updated = await api(`/api/crm/leads/${lead.id}`, {method:'PATCH', body: JSON.stringify({stages: lead.stages})});
    // Update local copy so re-render matches server
    const idx = DATA.leads.findIndex(l=>l.id===lead.id);
    if(idx >= 0) DATA.leads[idx] = updated;
  }catch(e){ showToast('Save failed: ' + e.message, true); }
}
async function updateStageStatus(leadId, i, val){
  const lead = findLead(leadId);
  lead.stages[i].status = val;
  lead.stages[i].updatedAt = new Date().toISOString();
  if(val==='Completed' && lead.stages[i+1] && lead.stages[i+1].status==='Pending'){
    lead.stages[i+1].status='In Progress';
    lead.stages[i+1].updatedAt = new Date().toISOString();
  }
  await patchStages(lead); showToast('Stage updated'); render();
}
async function updateStageNotes(leadId, i, val){
  const lead = findLead(leadId);
  lead.stages[i].notes = val;
  await patchStages(lead);
}
async function addDoc(leadId, stageKey, input){
  const file = input.files[0];
  if(!file) return;
  try{
    const fd = new FormData();
    fd.append('file', file);
    const meta = await api(`/api/crm/leads/${leadId}/stages/${stageKey}/documents`, {method:'POST', body: fd});
    const lead = findLead(leadId);
    const stage = (lead.stages||[]).find(x=>x.key===stageKey);
    if(stage){
      stage.documents = stage.documents || [];
      stage.documents.push(meta);
      await patchStages(lead);
    }
    showToast('Uploaded: ' + file.name);
    render();
  }catch(e){
    showToast('Upload failed: ' + e.message, true);
    render();
  }
}
async function removeDoc(leadId, stageKey, docId){
  try{
    await api(`/api/crm/leads/${leadId}/stages/${stageKey}/documents/${docId}`, {method:'DELETE'});
    const lead = findLead(leadId);
    const stage = (lead.stages||[]).find(x=>x.key===stageKey);
    if(stage){
      stage.documents = (stage.documents||[]).filter(d=>d.id!==docId);
      await patchStages(lead);
    }
    showToast('Document removed');
    render();
  }catch(e){ showToast('Could not remove document: ' + e.message, true); }
}
async function downloadDoc(leadId, stageKey, docId){
  try{
    const lead = findLead(leadId);
    const stage = (lead.stages||[]).find(x=>x.key===stageKey);
    const meta = (stage && stage.documents || []).find(d=>d.id===docId);
    const name = (meta && meta.name) || 'document';
    const url = API_BASE + `/api/crm/leads/${leadId}/stages/${stageKey}/documents/${docId}`;
    const res = await fetch(url, {headers: STATE.token ? {'Authorization':'Bearer '+STATE.token} : {}});
    if(!res.ok) throw new Error('Download failed (HTTP ' + res.status + ')');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  }catch(e){ showToast(e.message, true); }
}

async function addInv(leadId){
  const item_type = document.getElementById('invType').value;
  const name = (document.getElementById('invName').value||'').trim();
  const serial = (document.getElementById('invSerial').value||'').trim() || null;
  const quantity = parseInt(document.getElementById('invQty').value)||1;
  if(!name){ showToast('Item name is required.', true); return; }
  try{
    const created = await api(`/api/crm/leads/${leadId}/inventory`, {method:'POST', body: JSON.stringify({item_type, name, serial, quantity})});

    lead.inventory = lead.inventory || [];

    render();

        <div class="roi-card"><div class="k">LCOE</div><div class="v">${fmtINR(roi.lcoe_per_kwh)}/kWh</div></div>

  }catch(e){ showToast('ROI calculation failed: ' + e.message, true); }
}

async function updateQItem(leadId, i, field, val){

async function addQItem(leadId){
  const lead = findLead(leadId);
  lead.quotation.items.push({desc:'New item', qty:1, rate:0});
  await patchQuotation(lead); render();

async function removeQItem(leadId,i){
  const lead = findLead(leadId);
  lead.quotation.items.splice(i,1);
  await patchQuotation(lead); render();
}
async function updateGst(leadId, val){
  const lead = findLead(leadId);
  lead.quotation.gstPercent = Number(val);
  await patchQuotation(lead); render();
}

      <tbody>${inv.items.map(it=>`<tr><td>${it.desc}</td><td>${it.qty}</td><td class="mono">${fmtINR(it.rate)}</td><td class="mono">${fmtINR(it.qty*it.rate)}</td></tr>`).join('')}</tbody>

      <select id="payMode"><option value="">Mode…</option><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option><option>Card</option></select>

async function createInvoice(leadId){
  try{
    const updated = await api(`/api/crm/leads/${leadId}/invoice`, {method:'POST'});
    const idx = DATA.leads.findIndex(l=>l.id===leadId);
    if(idx>=0) DATA.leads[idx] = updated;
    showToast('Invoice created: ' + updated.invoice.number);
    render();
  }catch(e){ showToast(e.message, true); render(); }
}
async function addPayment(leadId){
  const amount = parseFloat(document.getElementById('payAmount').value);
  const mode = document.getElementById('payMode').value;
  const reference = (document.getElementById('payRef').value||'').trim() || null;
  if(!amount || amount<=0){ showToast('Enter a valid payment amount.', true); return; }
  if(!mode){ showToast('Select a payment mode.', true); return; }
  try{
    const updated = await api(`/api/crm/leads/${leadId}/invoice/payments`, {method:'POST', body: JSON.stringify({amount, mode, reference})});
    const idx = DATA.leads.findIndex(l=>l.id===leadId);
    if(idx>=0) DATA.leads[idx] = updated;
    showToast('Payment recorded');
    render();
  }catch(e){ showToast('Could not record payment: ' + e.message, true); }
}
async function removePayment(leadId, paymentId){
  try{
    const updated = await api(`/api/crm/leads/${leadId}/invoice/payments/${paymentId}`, {method:'DELETE'});
    const idx = DATA.leads.findIndex(l=>l.id===leadId);
    if(idx>=0) DATA.leads[idx] = updated;
    showToast('Payment removed');
    render();
  }catch(e){ showToast('Could not remove payment: ' + e.message, true); }
}

/* ---- PDF ---- */
function pdfLetterhead(doc, title){
  doc.setFillColor(27,111,168); doc.rect(0,0,210,26,'F');
  doc.setFillColor(63,165,53); doc.rect(0,26,210,2,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Step Solar Energy Pvt Ltd', 14, 12);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.text('Satramganj Bazar, Bhadaura, Uttar Pradesh - 232333', 14, 18);
  doc.text('GSTIN: 09ABPCS3779K1ZC   |   CIN: U42201UP2025PTC217484', 14, 23);
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(title, 196, 15, {align:'right'});
  doc.setTextColor(20,30,25);
}
function pdfCustomerBlock(doc, lead, y){
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Bill To', 14, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(lead.name, 14, y+6);
  doc.text(`${lead.city}, ${lead.state} - ${lead.pincode}`, 14, y+11);
  doc.text(`Phone: ${lead.contact}   Email: ${lead.email}`, 14, y+16);
  doc.text(`Property: ${lead.propertyType}   |   Roof: ${lead.roofType}`, 14, y+21);
  return y+29;
}
function downloadQuotationPDF(leadId){
  const raw = findLead(leadId); const lead = displayLead(raw);
  if(!raw.quotation){ showToast('Create a quotation first', true); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfLetterhead(doc, 'QUOTATION');
  doc.setFontSize(9); doc.setTextColor(75,90,84);
  doc.text(`Quotation No: QTN-${lead.code}`, 196, 34, {align:'right'});
  doc.text(`Date: ${new Date(raw.quotation.createdAt).toLocaleDateString('en-IN')}`, 196, 39, {align:'right'});
  doc.setTextColor(20,30,25);
  let y = pdfCustomerBlock(doc, lead, 36);
  const q = raw.quotation;
  const rows = q.items.map(it=>[it.desc, it.qty, `Rs. ${Math.round(it.rate).toLocaleString('en-IN')}`, `Rs. ${Math.round(it.qty*it.rate).toLocaleString('en-IN')}`]);
  doc.autoTable({startY:y, head:[['Description','Qty','Rate','Amount']], body:rows,
    headStyles:{fillColor:[27,111,168]}, styles:{fontSize:9.5}, margin:{left:14,right:14}});
  let fy = doc.lastAutoTable.finalY + 6;
  const subtotal = q.items.reduce((a,it)=>a+it.qty*it.rate,0);
  const gst = subtotal*q.gstPercent/100;
  const grand = subtotal+gst;
  doc.setFontSize(10);
  doc.text(`Subtotal: Rs. ${Math.round(subtotal).toLocaleString('en-IN')}`, 196, fy, {align:'right'});
  doc.text(`GST (${q.gstPercent}%): Rs. ${Math.round(gst).toLocaleString('en-IN')}`, 196, fy+6, {align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text(`Total: Rs. ${Math.round(grand).toLocaleString('en-IN')}`, 196, fy+14, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(75,90,84);
  doc.text('This is a system-estimated quotation. Final pricing may be confirmed after the site survey.', 14, fy+26, {maxWidth:180});
  doc.save(`Quotation-${lead.code}.pdf`);
  showToast('Quotation PDF downloaded');
}
function downloadInvoicePDF(leadId){
  const raw = findLead(leadId); const lead = displayLead(raw);
  if(!raw.invoice){ showToast('Create an invoice first', true); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfLetterhead(doc, 'TAX INVOICE');
  const inv = raw.invoice;
  doc.setFontSize(9); doc.setTextColor(75,90,84);
  doc.text(`Invoice No: ${inv.number}`, 196, 34, {align:'right'});
  doc.text(`Date: ${new Date(inv.createdAt).toLocaleDateString('en-IN')}`, 196, 39, {align:'right'});
  doc.text(`Payment Status: ${inv.paymentStatus}`, 196, 44, {align:'right'});
  doc.setTextColor(20,30,25);
  let y = pdfCustomerBlock(doc, lead, 36);
  const rows = inv.items.map(it=>[it.desc, it.qty, `Rs. ${Math.round(it.rate).toLocaleString('en-IN')}`, `Rs. ${Math.round(it.qty*it.rate).toLocaleString('en-IN')}`]);
  doc.autoTable({startY:y, head:[['Description','Qty','Rate','Amount']], body:rows,
    headStyles:{fillColor:[44,124,36]}, styles:{fontSize:9.5}, margin:{left:14,right:14}});
  let fy = doc.lastAutoTable.finalY + 6;
  const subtotal = inv.items.reduce((a,it)=>a+it.qty*it.rate,0);
  const gst = subtotal*inv.gstPercent/100;
  const grand = subtotal+gst;
  doc.setFontSize(10);
  doc.text(`Subtotal: Rs. ${Math.round(subtotal).toLocaleString('en-IN')}`, 196, fy, {align:'right'});
  doc.text(`GST (${inv.gstPercent}%): Rs. ${Math.round(gst).toLocaleString('en-IN')}`, 196, fy+6, {align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text(`Total: Rs. ${Math.round(grand).toLocaleString('en-IN')}`, 196, fy+14, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(75,90,84);
  doc.text('Thank you for choosing Step Solar Energy Pvt Ltd. This is a system-generated invoice.', 14, fy+26);

async function submitForceChangePassword(){
  const current_password = document.getElementById('fcpCurrent').value;
  const new_password = document.getElementById('fcpNew').value;
  const errEl = document.getElementById('fcpErr');
  if(!current_password || !new_password || new_password.length < 8){
    errEl.textContent = 'Enter your current password and a new password of at least 8 characters.';
    errEl.style.display = 'block';
    return;
  }
  try{
    await api('/api/auth/change-password', {method:'POST', body: JSON.stringify({current_password, new_password})});

    await refreshLeads();
    startPolling();
  }catch(e){
    errEl.textContent = e.message || 'Could not change password.';
    errEl.style.display = 'block';
  }
}

async function loadOps(force){
  if(OPS_LOADED && !force) return;
  try{
    const [inventory, logs, config] = await Promise.all([
      api('/api/crm/inventory'),
      api('/api/crm/whatsapp/logs'),
      api('/api/crm/whatsapp/config')
    ]);
    OPS_DATA.inventory = inventory || [];
    OPS_DATA.logs = logs || [];
    OPS_DATA.config = config || null;
    OPS_LOADED = true;
  }catch(e){
    showToast('Could not load ops data: ' + e.message, true);
  }
}

function waMsg(html){
  const el = document.getElementById('waSettingsMsg');
  if(el) el.innerHTML = html;
}

async function saveWhatsAppSettings(){
  try{
    const body = {
      api_url: document.getElementById('waApiUrl').value.trim(),
      key_header: document.getElementById('waKeyHeader').value.trim(),
      auth_mode: document.getElementById('waAuthMode').value,
      sender_id: document.getElementById('waSenderId').value.trim(),
      max_attempts: parseInt(document.getElementById('waMaxAttempts').value,10)||3,
      timeout_seconds: parseInt(document.getElementById('waTimeout').value,10)||10,
      base_url: document.getElementById('waBaseUrl').value.trim(),
      payload_template: document.getElementById('waTemplate').value.trim()
    };
    const newKey = document.getElementById('waApiKey').value.trim();
    if(newKey) body.api_key = newKey;
    const res = await api('/api/crm/whatsapp/config', {method:'PUT', body: JSON.stringify(body)});
    OPS_DATA.config = res;
    waMsg(`Saved — WhatsApp ${res.enabled?'<b style="color:var(--green-deep);">enabled</b>':'<b style="color:var(--danger);">disabled</b>'} (source: ${esc(res.source||'db')})`);
    showToast('WhatsApp settings saved');
    await loadOps(true);
    render();
  }catch(e){ waMsg('<b style="color:var(--danger);">'+esc(e.message)+'</b>'); showToast('Save failed: ' + e.message, true); }
}

async function testWhatsAppSend(){
  try{
    const phone = document.getElementById('waTestPhone').value.trim();
    if(!phone){ showToast('Enter a test phone number first.', true); return; }
    waMsg('Sending…');
    const res = await api('/api/crm/whatsapp/test-send', {method:'POST', body: JSON.stringify({phone, event:'QUOTATION_SENT'})});
    if(res.ok && res.status==='SUCCESS'){
      waMsg('Delivered to <b>'+esc(res.recipient)+'</b> <span style="color:var(--ink-soft);">(log '+esc(res.log_id||'')+')</span>');
    }else{
      waMsg('Status: <b style="color:var(--danger);">'+esc(res.status||'FAILED')+'</b> — see the WhatsApp delivery logs panel.');
    }
    await loadOps(true);
    render();
  }catch(e){ waMsg('<b style="color:var(--danger);">'+esc(e.message)+'</b>'); }
}

let USERS_DATA = [];
let TEAM = [];   // active team directory for assignment/task pickers

async function loadTeam(){
  try{
    TEAM = await api('/api/crm/users');
  }catch(e){
    TEAM = [];
  }
}

async function loadUsers(){
  try{
    USERS_DATA = await api('/api/admin/users');
  }catch(e){
    showToast('Could not load users: ' + e.message, true);
    USERS_DATA = [];
  }
}

function renderUsersView(){
  const rows = USERS_DATA.map(u => `
    <tr data-testid="user-row-${esc(u.id)}">
      <td>${esc(u.full_name)}</td>
      <td class="mono">${esc(u.email)}</td>
      <td><span class="chip-role ${roleClass(u.role)}">${esc(u.role)}</span></td>
      <td>${u.active ? 'Active' : '<span style="color:var(--rose);">Disabled</span>'}${u.must_change_password ? ' <span style="color:var(--ink-soft);font-size:0.72rem;">(temp password)</span>' : ''}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-ghost" style="padding:5px 10px;font-size:0.78rem;" onclick="openEditUserModal('${u.id}','${esc(u.full_name)}','${esc(u.email)}','${esc(u.role)}')">Edit</button>
        <button class="btn btn-ghost" style="padding:5px 10px;font-size:0.78rem;" onclick="toggleUserActive('${u.id}', ${u.active})" ${u.id===STATE.userId?'disabled title="Cannot deactivate your own account"':''}>${u.active?'Disable':'Enable'}</button>
        <button class="btn btn-ghost" style="padding:5px 10px;font-size:0.78rem;" onclick="openResetPasswordModal('${u.id}','${esc(u.email)}')">Reset password</button>
      </td>
    </tr>`).join('');

  return `
  <div class="users-view">
    <div class="view-head">
      <h2>Team &amp; Access</h2>
      <button class="btn btn-sun" onclick="openNewUserModal()" data-testid="new-user-btn">+ Add team member</button>
    </div>
    <table class="leads-table">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--ink-soft);">Loading…</td></tr>'}</tbody>
    </table>
  </div>`;
}

function wireUsersView(){
  if(USERS_DATA.length === 0){
    loadUsers().then(render);
  }
}

function openNewUserModal(){
  document.getElementById('modalBackdrop').innerHTML = `
    <div class="modal open">
      <h3>Add team member</h3>
      <label>Full name</label>
      <input id="nuName" placeholder="e.g. Priya Sharma">
      <label>Email</label>
      <input id="nuEmail" type="email" placeholder="name@stepsolar.in">
      <label>Role</label>
      <select id="nuRole">
        ${['Admin', ...ROLES].map(r => `<option value="${r}">${r}</option>`).join('')}
      </select>
      <label>Temporary password</label>
      <input id="nuPassword" type="text" placeholder="At least 8 characters">
      <p style="font-size:0.72rem;color:var(--ink-soft);margin-top:6px;">They'll be required to change this password on first login.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-sun" onclick="submitNewUser()">Create user</button>
      </div>
    </div>`;
  document.getElementById('modalBackdrop').classList.add('open');
}

async function submitNewUser(){
  const full_name = document.getElementById('nuName').value.trim();
  const email = document.getElementById('nuEmail').value.trim();
  const role = document.getElementById('nuRole').value;
  const temp_password = document.getElementById('nuPassword').value;
  if(!full_name || !email || !temp_password){
    showToast('Please fill in every field.', true);
    return;
  }
  try{
    const created = await api('/api/admin/users', {method:'POST', body: JSON.stringify({full_name, email, role, temp_password})});
    USERS_DATA.unshift(created);
    closeModal();
    showToast('User created: ' + created.email);
    render();
  }catch(e){
    showToast('Could not create user: ' + e.message, true);
  }
}

async function toggleUserActive(userId, currentlyActive){
  try{
    const updated = await api(`/api/admin/users/${userId}`, {method:'PATCH', body: JSON.stringify({active: !currentlyActive})});
    USERS_DATA = USERS_DATA.map(u => u.id === updated.id ? updated : u);
    render();
  }catch(e){
    showToast('Could not update user: ' + e.message, true);
  }
}

function openEditUserModal(userId, fullName, email, role){
  document.getElementById('modalBackdrop').innerHTML = `
    <div class="modal open">
      <h3>Edit user</h3>
      <p style="font-size:0.85rem;color:var(--ink-soft);">Update details for <b>${esc(email)}</b>.</p>
      <label>Full name</label>
      <input id="euName" value="${esc(fullName)}">
      <label>Role</label>
      <select id="euRole">
        ${['Admin', ...ROLES].map(r => `<option value="${esc(r)}" ${r===role?'selected':''}>${esc(r)}</option>`).join('')}
      </select>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-sun" onclick="submitEditUser('${userId}')">Save changes</button>
      </div>
    </div>`;
  document.getElementById('modalBackdrop').classList.add('open');
}

async function submitEditUser(userId){
  const full_name = document.getElementById('euName').value.trim();
  const role = document.getElementById('euRole').value;
  if(!full_name){
    showToast('Full name cannot be empty.', true);
    return;
  }
  try{
    const updated = await api(`/api/admin/users/${userId}`, {method:'PATCH', body: JSON.stringify({full_name, role})});
    USERS_DATA = USERS_DATA.map(u => u.id === updated.id ? updated : u);
    if(userId === STATE.userId){
      STATE.fullName = updated.full_name;
      STATE.role = updated.role;
      const saved = _loadAuth();
      if(saved){
        saved.full_name = updated.full_name;
        saved.role = updated.role;
        localStorage.setItem(AUTH_KEY, JSON.stringify(saved));
      }
    }
    closeModal();
    showToast('User updated.');
    render();
  }catch(e){
    showToast('Could not update user: ' + e.message, true);
  }
}

function openResetPasswordModal(userId, email){
  document.getElementById('modalBackdrop').innerHTML = `
    <div class="modal open">
      <h3>Reset password</h3>
      <p style="font-size:0.85rem;color:var(--ink-soft);">New temporary password for <b>${esc(email)}</b>. They'll be asked to change it on next login.</p>
      <label>New temporary password</label>
      <input id="rpPassword" type="text" placeholder="At least 8 characters">
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-sun" onclick="submitResetPassword('${userId}')">Reset</button>
      </div>
    </div>`;
  document.getElementById('modalBackdrop').classList.add('open');
}

async function submitResetPassword(userId){
  const reset_password = document.getElementById('rpPassword').value;
  if(!reset_password || reset_password.length < 8){
    showToast('Password must be at least 8 characters.', true);
    return;
  }
  try{
    const updated = await api(`/api/admin/users/${userId}`, {method:'PATCH', body: JSON.stringify({reset_password})});
    USERS_DATA = USERS_DATA.map(u => u.id === updated.id ? updated : u);
    closeModal();
    showToast('Password reset.');
    render();
  }catch(e){
    showToast('Could not reset password: ' + e.message, true);
  }
}

/* ======================= INIT ======================= */
async function boot(){
  if(STATE.token){
    try{
      await api('/api/auth/me');
      STATE.authed = true;
      if(_savedAuth && _savedAuth.must_change_password){
        render();
        openForceChangePasswordModal();
        return;
      }
      await refreshLeads();
      startPolling();
      loadTeam();
    }catch(e){
      STATE.authed = false;
      STATE.token = ''; STATE.role = ''; STATE.email = ''; STATE.fullName = ''; STATE.userId = '';
      localStorage.removeItem(AUTH_KEY);
    }
  }
  render();
}
boot();
window.addEventListener('beforeunload', stopPolling);
</script>
</body>
</html>
